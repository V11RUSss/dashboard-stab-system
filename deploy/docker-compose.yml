# docker-compose.yml
# Запуск: docker compose up --build
#
# Перед запуском указать сетевой интерфейс:
#   export IFACE=eth0   (интерфейс, на котором приходят пакеты от BRO30)
#   docker compose up --build

services:
  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      network: host
    container_name: bro30_frontend
    network_mode: host
    environment:
      - WEBSOCKET_URL=ws://localhost:8765
    restart: unless-stopped
    depends_on:
      - backend

  # ── Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      network: host
    container_name: bro30_backend
    network_mode: host
    volumes:
      - ../backend/storage:/app/storage
      - ../gateway/bro_spec.json:/app/protocol/bro_spec.json:ro
      - ../gateway/microjetlib/inc/mjsysspec.h:/app/protocol/mjsysspec.h:ro
      - ../gateway/microjetlib/bup_dcu_lfd/mj_bup_dcu_lfd_spec.c:/app/protocol/mj_bup_dcu_lfd_spec.c:ro
    environment:
      - RECORDING_MIN_FREE_GB=${RECORDING_MIN_FREE_GB:-10}
      - BRO_SPEC_PATH=/app/protocol/bro_spec.json
      - MJ_SYS_SPEC_PATH=/app/protocol/mjsysspec.h
      - MJ_DCU_SPEC_PATH=/app/protocol/mj_bup_dcu_lfd_spec.c
    restart: unless-stopped

  # ── Gateway (C++, REAL режим) ─────────────────────────────────
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
      network: host
      args:
        - REAL_MODE=ON
    container_name: bro30_gateway
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_NICE
    environment:
      - GATEWAY_MODE=real
      - BACKEND_ADDR=127.0.0.1
      - BACKEND_PORT=8888
      - IFACE_NAME=veth1
    restart: unless-stopped
    depends_on:
      - backend
